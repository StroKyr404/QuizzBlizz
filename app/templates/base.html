<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}QuizBlizz - Schul-Quiz{% endblock %}</title>

    <!-- Local Compiled Tailwind CSS (100% offline, zero external tracking) -->
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Local Canvas Confetti for podium -->
    <script src="/static/vendor/confetti.browser.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col font-sans select-none antialiased">
    {% block content %}{% endblock %}

    <!-- Built-in Web Audio Sound Synthesizer -->
    <script src="/static/js/sound.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
